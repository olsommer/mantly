name: Backup and restore

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-drill:
    name: Synthetic volume restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: ${{ github.workspace }}/tests/fixtures/backup/docker-compose.yml
      COMPOSE_PROJECT_NAME: mantly-backup-ci
      ALLOW_UNENCRYPTED_BACKUP: "true"
      RESTORE_CONFIRM: ERASE_AND_RESTORE_MANTLY
      BACKUP_REASON: ci-restore-drill
      BACKUP_OPERATOR: github-actions
      RESTORE_API_URL: http://127.0.0.1:18080
      RESTORE_PB_URL: http://127.0.0.1:18090
      PB_ADMIN_EMAIL: restore@example.test
      PB_ADMIN_PASSWORD: restore-fixture-password
      RESTORE_EXPECTATIONS_FILE: ${{ github.workspace }}/tests/fixtures/backup/restore-expectations.json

    steps:
      - uses: actions/checkout@v4

      - name: Validate scripts
        run: |
          set -euo pipefail
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh
          python3 -m py_compile scripts/verify-restore.py

      - name: Start isolated durable-volume fixture
        run: docker compose up -d

      - name: Seed representative PocketBase and application state
        run: |
          set -euo pipefail
          docker compose exec -T pocketbase python - <<'PY'
          import os
          import pathlib
          import hashlib
          import json
          import sqlite3

          assert os.getuid() == 10001, os.getuid()
          assert os.getgid() == 10001, os.getgid()
          database = pathlib.Path('/pb/pb_data/data.db')
          database.parent.mkdir(parents=True, exist_ok=True)
          connection = sqlite3.connect(database)
          try:
              connection.execute('CREATE TABLE restore_fixture (id INTEGER PRIMARY KEY, value TEXT NOT NULL)')
              connection.execute('INSERT INTO restore_fixture(value) VALUES (?)', ('before-backup',))
              connection.commit()
          finally:
              connection.close()
          attachment = pathlib.Path('/pb/pb_data/attachment.txt')
          attachment.write_text('attachment-before-backup\n', encoding='utf-8')
          fixture = {
              'collectionCounts': {
                  'tenants': 1,
                  'users': 1,
                  'projects': 1,
                  'project_intents': 1,
                  'knowledge_articles': 1,
                  'support_issues': 1,
                  'support_messages': 1,
                  'support_internal_notes': 1,
                  'support_outbound_messages': 1,
                  'support_action_executions': 1,
                  'support_ai_runs': 1,
              },
              'records': {
                  'projects': {'project-001': {'tenant': 'tenant-001'}},
                  'support_issues': {'ticket-001': {'timeline_ref': 'timeline-001'}},
                  'support_outbound_messages': {
                      'outbound-001': {'delivery_state': 'delivered'}
                  },
                  'project_intents': {
                      'runbook-001': {'knowledge_ref': 'knowledge-001'}
                  },
                  'support_messages': {
                      'message-001': {
                          'attachment_name': attachment.name,
                          'attachment_sha256': hashlib.sha256(attachment.read_bytes()).hexdigest(),
                      }
                  },
                  'support_action_executions': {
                      'action-001': {'audit_ref': 'audit-001'}
                  },
              },
          }
          pathlib.Path('/pb/pb_data/restore-fixture.json').write_text(
              json.dumps(fixture), encoding='utf-8'
          )
          PY
          docker compose exec -T app sh -ec \
            'test "$(id -u)" = 1000; test "$(id -g)" = 1000; mkdir -p /app/data/nested; printf "application-before-backup\n" > /app/data/nested/state.txt; ln -s /etc /app/data/external-link'

      - name: Simulate legacy root-owned backup data
        run: |
          set -euo pipefail
          docker compose stop app pocketbase
          docker compose run --rm --no-deps --user 0:0 pocketbase \
            sh -ec 'chown -hRP 0:0 /pb/pb_data'
          docker compose run --rm --no-deps --user 0:0 app \
            sh -ec 'chown -hRP 0:0 /app/data'

      - name: Create consistent backup bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mantly-backups"
          bash scripts/backup.sh "$RUNNER_TEMP/mantly-backups"
          bundle="$(find "$RUNNER_TEMP/mantly-backups" -maxdepth 1 -name 'mantly-backup-*.tar.gz' -type f | head -n 1)"
          test -n "$bundle"
          test -s "$bundle"
          test -s "$bundle.sha256"
          mkdir -p "$RUNNER_TEMP/restore-input"
          mv "$bundle" "$bundle.sha256" "$RUNNER_TEMP/restore-input/"
          bundle="$RUNNER_TEMP/restore-input/$(basename "$bundle")"
          (cd "$RUNNER_TEMP/restore-input" && sha256sum -c "$(basename "$bundle.sha256")")
          printf 'BACKUP_BUNDLE=%s\n' "$bundle" >> "$GITHUB_ENV"

      - name: Mutate and delete durable state after backup
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps --user 0:0 pocketbase python - <<'PY'
          import pathlib
          import sqlite3

          database = pathlib.Path('/pb/pb_data/data.db')
          connection = sqlite3.connect(database)
          try:
              connection.execute('UPDATE restore_fixture SET value = ?', ('after-backup-corruption',))
              connection.commit()
          finally:
              connection.close()
          pathlib.Path('/pb/pb_data/attachment.txt').unlink()
          pathlib.Path('/pb/pb_data/unwanted-after-backup.txt').write_text('must disappear\n', encoding='utf-8')
          PY
          docker compose run --rm --no-deps --user 0:0 app sh -ec \
            "printf 'after-backup-corruption\n' > /app/data/nested/state.txt; printf 'must disappear\n' > /app/data/unwanted.txt"
          docker compose stop app pocketbase

      - name: Restore and verify the backup
        run: bash scripts/restore.sh "$BACKUP_BUNDLE"

      - name: Prove restored database, attachment, and application state
        run: |
          set -euo pipefail
          docker compose exec -T pocketbase python - <<'PY'
          import os
          import pathlib
          import sqlite3

          assert os.getuid() == 10001, os.getuid()
          assert os.getgid() == 10001, os.getgid()
          database = pathlib.Path('/pb/pb_data/data.db')
          connection = sqlite3.connect(database)
          try:
              value = connection.execute('SELECT value FROM restore_fixture').fetchone()[0]
              integrity = connection.execute('PRAGMA integrity_check').fetchone()[0]
              connection.execute('BEGIN IMMEDIATE')
              connection.execute(
                  'UPDATE restore_fixture SET value = value WHERE id = 1'
              )
              connection.rollback()
          finally:
              connection.close()
          assert value == 'before-backup', value
          assert integrity == 'ok', integrity
          assert pathlib.Path('/pb/pb_data/attachment.txt').read_text(encoding='utf-8') == 'attachment-before-backup\n'
          assert not pathlib.Path('/pb/pb_data/unwanted-after-backup.txt').exists()
          probe = pathlib.Path('/pb/pb_data/post-restore-write-check')
          probe.write_text('writable\n', encoding='utf-8')
          probe.unlink()
          PY
          docker compose exec -T app sh -ec \
            'test "$(id -u)" = 1000; test "$(id -g)" = 1000; grep -Fxq "application-before-backup" /app/data/nested/state.txt; test ! -e /app/data/unwanted.txt; test -L /app/data/external-link; test "$(readlink /app/data/external-link)" = /etc; printf "writable\n" > /app/data/nested/post-restore-write-check; rm /app/data/nested/post-restore-write-check'

      - name: Prove missing required attachment evidence fails closed
        run: |
          set -euo pipefail
          docker compose run --rm pocketbase python - <<'PY'
          import json
          import pathlib

          path = pathlib.Path('/pb/pb_data/restore-fixture.json')
          fixture = json.loads(path.read_text(encoding='utf-8'))
          del fixture['records']['support_messages']['message-001']['attachment_sha256']
          path.write_text(json.dumps(fixture), encoding='utf-8')
          PY
          if python3 scripts/verify-restore.py; then
            echo "Verifier accepted missing attachment evidence" >&2
            exit 1
          fi

      - name: Upload backup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-backup-restore-evidence
          path: |
            ${{ env.BACKUP_BUNDLE }}
            ${{ env.BACKUP_BUNDLE }}.sha256
          if-no-files-found: ignore
          retention-days: 3

      - name: Stop fixture
        if: always()
        run: docker compose down -v --remove-orphans
