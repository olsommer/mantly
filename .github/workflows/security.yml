name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run canonical secret scan
        run: ./scripts/check-quality.sh security-secret

  python-dependency-audit:
    name: Python production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.32

      - name: Run canonical Python production dependency audit
        run: ./scripts/check-quality.sh security-python

  node-dependency-audit:
    name: Node production audit (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, addin, landing]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install locked dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci --ignore-scripts

      - name: Run canonical Node production dependency audit
        run: ./scripts/check-quality.sh security-node ${{ matrix.app }}

  dockerfile-and-compose-scan:
    name: Container configuration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run canonical container and repository configuration scan
        run: ./scripts/check-quality.sh security-config

  security-policy-check:
    name: Security policy contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run canonical security policy contract
        run: ./scripts/check-quality.sh security-policy
