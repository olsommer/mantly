name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  AUTOMAIL_BACKGROUND_IO: "disabled"
  GOOGLE_API_KEY: "dummy-ci-key"
  REQUIRE_AUTH: "false"

jobs:
  backend-quality:
    name: Backend lint and type safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Ruff
        run: ./scripts/check-quality.sh backend-lint

  backend-tests:
    name: Backend test suite and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run canonical backend tests and coverage contract
        run: ./scripts/check-quality.sh backend-tests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/coverage.json
          if-no-files-found: error
          retention-days: 14

  pocketbase-integration:
    name: PocketBase bootstrap and delivery fencing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run canonical clean, existing-snapshot, isolation, and fencing contract
        run: ./scripts/check-quality.sh pocketbase

  frontend-quality:
    name: Frontend quality (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [addin, admin, landing]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install locked dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Run canonical frontend contract
        run: ./scripts/check-quality.sh frontend ${{ matrix.app }}

  auth-e2e:
    name: Auth and tenant lifecycle E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            addin/package-lock.json
            admin/package-lock.json

      - name: Install add-in dependencies
        working-directory: addin
        run: npm ci

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: addin
        run: npx playwright install --with-deps chromium

      - name: Run real auth and Admin Inbox lifecycles
        env:
          CI: "true"
        run: ./scripts/check-quality.sh e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-e2e-playwright-report
          path: addin/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-e2e-service-logs
          path: |
            /tmp/mantly-auth-e2e-backend.log
            /tmp/mantly-auth-e2e-addin.log
            /tmp/mantly-auth-e2e-admin.log
            /tmp/mantly-auth-e2e-delivery-stub.log
          if-no-files-found: ignore
          retention-days: 14

  docker-build:
    name: Production image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run canonical production image contract
        run: ./scripts/check-quality.sh images

  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run canonical repository contract
        run: ./scripts/check-quality.sh repository
