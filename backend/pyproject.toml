[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "httpx>=0.28.0",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.2.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
    "slowapi>=0.1.9",
    "stripe>=12.0.0",
    "python-multipart>=0.0.32",
    "tzdata>=2025.2",
    "uvicorn>=0.40.0",
    "langchain-openai>=1.1.14",
    "websockets>=15.0.1",
    "just-bash==0.2.1",
]

[project.optional-dependencies]
attachments = ["docling>=2.70.0"]
postgres = ["psycopg2-binary>=2.9"]

[tool.uv]
constraint-dependencies = [
    "click>=8.3.3",
    "idna>=3.15",
    "langchain-core>=1.3.3",
    "langgraph>=1.2.9",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-sdk>=0.3.15",
    "langsmith>=0.8.18",
    "orjson>=3.11.6",
    "pyasn1>=0.6.4",
    "requests>=2.33.0",
    "soupsieve>=2.8.4",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
]

[tool.pytest.ini_options]
markers = [
    "no_gemini: tests that don't call the Gemini API",
]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pyright>=1.1.409",
    "pytest>=7.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
]

[tool.pyright]
include = ["automail"]
exclude = [
    "**/__pycache__",
    ".venv",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMissingTypeArgument = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportUntypedFunctionDecorator = false
reportPrivateUsage = false
reportUnusedFunction = false
reportUnusedClass = false
reportUnusedImport = false
reportUnnecessaryIsInstance = false
reportUnnecessaryComparison = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long — handled by formatter if needed
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F841"]   # sys.path.insert before imports; test helper vars
"automail/main.py" = ["E402"]  # load_dotenv must run before any automail imports

[tool.ruff.lint.isort]
known-first-party = ["automail"]

[tool.coverage.run]
branch = true
source = ["automail"]
omit = [
    "automail/demo/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
